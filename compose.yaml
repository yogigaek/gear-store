# Local services for development:
#   docker compose up -d --wait
# PostgreSQL on 127.0.0.1:5436 (5432–5435 are often taken by other projects).
# Mailpit catches every email the API sends: SMTP on 1025, inbox UI at http://localhost:8025.
# Credentials here are local placeholders only.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gear
      POSTGRES_PASSWORD: gear
      POSTGRES_DB: gear
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gear -d gear']
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  pgdata:
