# Render Blueprint for the API (Dashboard → New → Blueprint → this repository).
# Values marked `sync: false` are entered in the dashboard and never stored in git.
services:
  - type: web
    name: rakit-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    # npm 10 cannot resolve this workspace (see package.json packageManager), so install with npm 11
    # --include=dev: NODE_ENV=production would otherwise skip the Nest and Prisma CLIs that build and migrate need
    buildCommand: npx -y npm@11.21.0 ci --include=dev && npm run build -w @gear-store/shared && npm run build -w @gear-store/api
    # migrations, then a one-time seed of an empty database and the ADMIN_EMAIL grant, then the server
    startCommand: npm run start:render -w @gear-store/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # Neon: the pooled connection string for the app, the direct one for migrations
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      # the Vercel address of the web app, e.g. https://rakit-store.vercel.app (no trailing slash)
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # e.g. smtps://USER:PASSWORD@smtp.example.com:465 from the email provider
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      # the visitor address for rate limits comes from headers the hosting sets (measured 10 Oct 2026):
      # Vercel's x-vercel-forwarded-for through the web app, Cloudflare's true-client-ip for direct calls.
      # X-Forwarded-For is not used: it also carries whatever the visitor sent.
      - key: CLIENT_IP_HEADERS
        value: x-vercel-forwarded-for,true-client-ip
      # the same random value as the web app's PROXY_SECRET on Vercel (apps/web/vercel.json sends it): while
      # set, x-vercel-forwarded-for is believed only on requests carrying it, since direct callers can write it
      # set it on Vercel (Production and Preview) and redeploy the web first, then here: see README, Deploy
      - key: PROXY_SECRET
        sync: false
      # only a fallback now; Render's chain is visitor → Cloudflare → load balancer
      - key: TRUST_PROXY
        value: '3'
      - key: ADMIN_EMAIL
        sync: false
