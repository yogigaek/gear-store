name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gear
          POSTGRES_PASSWORD: gear
          POSTGRES_DB: gear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gear -d gear"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://gear:gear@localhost:5432/gear
      WEB_ORIGIN: http://localhost:5173
      # test-only values: the e2e suite replaces the mailer and nothing here protects real data
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
      SMTP_URL: smtp://localhost:1025
      MIDTRANS_SERVER_KEY: SB-Mid-server-ci-only-not-a-real-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # npm 10 crashes resolving this workspace's peer set; the repo pins npm 11 in packageManager
      - name: use npm 11
        run: npm install -g npm@11.21.0
      - run: npm ci
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: unit tests
        run: npm test
      - name: migrate test database
        run: npm run db:deploy -w @gear-store/api
      - name: seed demo data
        run: npm run db:seed -w @gear-store/api
      - name: API e2e
        run: npm run test:e2e -w @gear-store/api
      - name: build
        run: npm run build
      # the Android bundle from a clean checkout: proves Metro resolves every import, @gear-store/shared included
      - name: mobile bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://yogi-store.vercel.app/api
        run: npx expo export --platform android --output-dir ${{ runner.temp }}/mobile-export

  # The whole stack in a real browser: sign-up through Mailpit, checkout, a signed payment notification,
  # admin fulfilment. Runs against the production build served by `vite preview`.
  browser:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gear
          POSTGRES_PASSWORD: gear
          POSTGRES_DB: gear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gear -d gear"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://gear:gear@localhost:5432/gear
      WEB_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
      SMTP_URL: smtp://localhost:1025
      MIDTRANS_SERVER_KEY: SB-Mid-server-ci-only-not-a-real-key
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: use npm 11
        run: npm install -g npm@11.21.0
      - run: npm ci
      - name: build
        run: npm run build
      - name: database
        run: |
          npm run db:deploy -w @gear-store/api
          npm run db:seed -w @gear-store/api
      - name: start API and web
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          (cd apps/web && npx vite preview --port 5173 --strictPort > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/health && exit 0
            sleep 1
          done
          cat api.log web.log
          exit 1
      - name: install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: browser tests
        run: npm run test:browser
      - name: keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            web.log
          retention-days: 7
